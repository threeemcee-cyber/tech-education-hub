<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tech Education Hub</title>
<meta name="description" content="Free tech courses with your progress synced from the TV and PC app.">
<meta name="theme-color" content="#0b0f17">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tech Hub">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#0b0f17;--card:#141a25;--card2:#1d2738;--ink:#e9edf3;--mut:#93a0b4;--acc:#f5b83d;--ok:#3ecf8e;--bad:#ff8a8a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(11,15,23,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid #1a2130}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;white-space:nowrap}
.logo b{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--acc);color:var(--bg);font-size:13px}
.back{display:none;padding:7px 12px;border-radius:18px;background:var(--card2);font-weight:600;font-size:14px}
.back.on{display:inline-block}
.who-chip{margin-left:auto;font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
main{padding:16px 16px 40px;max-width:900px;margin:0 auto}
h1{font-size:26px;margin:6px 0 4px;line-height:1.2}
h2{font-size:15px;font-weight:400;color:var(--mut);margin:0 0 16px}
h3{font-size:15px;color:var(--mut);font-weight:600;margin:22px 0 10px;text-transform:uppercase;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{position:relative;display:block;width:100%;text-align:left;background:var(--card);border-radius:14px;padding:14px;min-height:96px}
.card:active{background:var(--card2)}
.card .n{font-weight:650;font-size:16px;line-height:1.25}
.card .s{color:var(--mut);font-size:13px;margin-top:3px}
.card .m{color:var(--mut);font-size:12.5px;margin-top:8px}
.bar{height:4px;border-radius:2px;background:#283246;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.person{text-align:center;padding:18px 10px}
.av{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;color:var(--bg);font-weight:700;font-size:28px}
.av.add{background:var(--card2);color:var(--mut);font-weight:400}
.person .n{margin-top:10px}
.cont{display:flex;gap:12px;align-items:center;padding:10px}
.cont img{width:128px;height:72px;border-radius:9px;object-fit:cover;flex:none;background:#222}
.cont .k{color:var(--acc);font-size:12px;font-weight:600}
.cont .n{font-size:14.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.list .row{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid #1a2130}
.row .th{position:relative;flex:none;width:132px;height:74px;border-radius:9px;overflow:hidden;background:#222}
.row .th img{width:100%;height:100%;object-fit:cover}
.row .th .bar{position:absolute;left:0;right:0;bottom:0;margin:0;border-radius:0}
.row .th .num{position:absolute;left:5px;top:5px;background:rgba(0,0,0,.7);border-radius:6px;padding:0 6px;font-size:12px;font-weight:700}
.row .tx{flex:1;min-width:0}
.row .n{font-size:14.5px;font-weight:550;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .m{font-size:12.5px;color:var(--mut);margin-top:4px}
.row .ok{color:var(--ok);font-weight:600}
.row.now .n{color:var(--acc)}
.head{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:8px}
.pill{display:inline-block;padding:9px 14px;border-radius:20px;background:var(--acc);color:var(--bg);font-weight:700;font-size:14px}
a.pill{text-decoration:none}.pill.ghost{background:var(--card2);color:var(--ink)}
.player{position:sticky;top:51px;z-index:4;background:#000;max-width:900px;margin:0 auto}.player[hidden]{display:none}
.player .frame{position:relative;width:100%;padding-top:56.25%}
.player .frame>div,.player .frame iframe{position:absolute;inset:0;width:100%;height:100%}
.pinfo{padding:12px 0 6px}
.pinfo .n{font-size:17px;font-weight:650;line-height:1.3}
.pinfo .c{font-size:13px;color:var(--acc);margin-top:4px}
.ctl{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.ctl button{flex:1 1 auto;min-width:64px;padding:11px 10px;border-radius:12px;background:var(--card2);font-weight:600;font-size:14px}
.ctl button.on{background:var(--ok);color:var(--bg)}
.box{background:var(--card);border-radius:14px;padding:16px;margin:12px 0}
.box p{margin:0 0 10px;color:#c7cfdb;font-size:14.5px}
input{width:100%;padding:13px 14px;border-radius:12px;border:2px solid #283246;background:#0f1520;color:var(--ink);font:inherit;font-size:17px}
input:focus{outline:none;border-color:var(--acc)}
.btnrow{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.danger{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--acc);color:#111;font-weight:600;border-radius:12px;padding:11px 18px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center;z-index:9}
.toast.on{opacity:1}
.status{font-size:12.5px;color:var(--mut);margin-top:6px}
.empty{color:var(--mut);padding:30px 0}
</style>
</head>
<body>
<div class="top"><div class="logo"><b>&#9654;</b>Tech Education Hub</div><button class="back" id="back">&#8592; Back</button><div class="who-chip" id="chip"></div></div>
<div class="player" id="pw" hidden><div class="frame"><div id="ytp"></div></div></div>
<main id="page"></main>
<div class="toast" id="toast"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
